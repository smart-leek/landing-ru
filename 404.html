<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aivestum</title>
<meta name="description" content="Aivestum. Планируйте праздник с умом. Готовимся к запуску.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07130F" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Aivestum">
<meta property="og:description" content="Планируйте праздник с умом">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#FAF7F2;
  --bg-2:#F3EEE6;
  --ink:#0F231D;
  --muted:#56665F;
  --line:rgba(15,35,29,.10);
  --emerald:#0E8A65;
  --emerald-hi:#22B98B;
  --emerald-deep:#06402F;
  --coral:#FF6B5B;
  --coral-hi:#FF9C8E;
  --glow-e:rgba(14,138,101,.20);
  --glow-c:rgba(255,107,91,.20);
  --acc-a:#0A6A4D;
  --acc-b:#14A479;
  --grain:.05;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07130F;
    --bg-2:#0B1C16;
    --ink:#EDF5F1;
    --muted:#9DB2AA;
    --line:rgba(237,245,241,.10);
    --emerald:#22B98B;
    --emerald-hi:#4FE0B1;
    --emerald-deep:#053325;
    --coral:#FF7A6A;
    --coral-hi:#FFB0A4;
    --glow-e:rgba(34,185,139,.22);
    --glow-c:rgba(255,122,106,.16);
    --acc-a:#22B98B;
    --acc-b:#6FE6BE;
    --grain:.07;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07130F;--bg-2:#0B1C16;--ink:#EDF5F1;--muted:#9DB2AA;--line:rgba(237,245,241,.10);
  --emerald:#22B98B;--emerald-hi:#4FE0B1;--emerald-deep:#053325;--coral:#FF7A6A;--coral-hi:#FFB0A4;
  --glow-e:rgba(34,185,139,.22);--glow-c:rgba(255,122,106,.16);--acc-a:#22B98B;--acc-b:#6FE6BE;--grain:.07;color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"ss01","cv11";
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* фон: мягкое сияние двух цветов и зерно */
.aura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.aura .e{width:60vmax;height:60vmax;left:-18vmax;bottom:-26vmax;background:var(--glow-e);animation:drift-a 26s ease-in-out infinite alternate}
.aura .c{width:52vmax;height:52vmax;right:-16vmax;top:-22vmax;background:var(--glow-c);animation:drift-b 30s ease-in-out infinite alternate}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes drift-a{to{transform:translate(8vmax,-6vmax) scale(1.08)}}
@keyframes drift-b{to{transform:translate(-6vmax,7vmax) scale(1.1)}}

/* каркас */
.page{
  position:relative;z-index:2;
  min-height:100vh;min-height:100svh;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:clamp(20px,4vw,40px) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  max-width:1200px;margin:0 auto;
}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}

/* словесный знак: точка над i сферой */
.mark{font-weight:700;font-size:23px;letter-spacing:-.035em;line-height:1;color:var(--ink);text-decoration:none;display:inline-flex;align-items:baseline}
.mark .i{position:relative;display:inline-block}
.mark .i::before{
  content:"";position:absolute;left:50%;top:-.02em;width:.27em;height:.27em;margin-left:-.135em;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff 0 8%,transparent 34%),radial-gradient(circle at 72% 76%,var(--coral) 0,transparent 62%),radial-gradient(circle at 40% 40%,var(--emerald-hi),var(--emerald) 60%,var(--emerald-deep));
  box-shadow:0 0 10px var(--glow-c);
}

.chip{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:9px 14px;border:1px solid var(--line);border-radius:999px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--coral);position:relative;flex:none}
.chip b::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--coral);opacity:0;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}

main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(24px,6vh,64px) 0}

/* сцена: две стрелки идут навстречу и становятся сферой */
.scene{position:relative;width:min(460px,100%);height:clamp(170px,26vh,220px);margin-bottom:clamp(20px,4vh,40px)}
.arrow{position:absolute;top:50%;width:118px;height:24px;margin-top:-12px;opacity:0}
.arrow svg{display:block;width:100%;height:100%;overflow:visible}
.arrow.l{color:var(--coral);left:0;animation:in-l 1.5s cubic-bezier(.65,0,.35,1) .35s forwards}
.arrow.r{color:var(--emerald);right:0;animation:in-r 1.5s cubic-bezier(.65,0,.35,1) .35s forwards}
.arrow.r svg{transform:scaleX(-1)}
@keyframes in-l{
  0%{left:0;opacity:0}
  18%{opacity:1}
  82%{left:calc(50% - 112px);opacity:1;transform:scaleX(1)}
  100%{left:calc(50% - 112px);opacity:0;transform:scaleX(.15) translateX(300px)}
}
@keyframes in-r{
  0%{right:0;opacity:0}
  18%{opacity:1}
  82%{right:calc(50% - 112px);opacity:1;transform:scaleX(1)}
  100%{right:calc(50% - 112px);opacity:0;transform:scaleX(.15) translateX(-300px)}
}

.burst{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;
  border:1.5px solid var(--coral);opacity:0;animation:burst 1s ease-out 1.65s forwards}
.burst.b2{border-color:var(--emerald);animation-delay:1.78s}
@keyframes burst{0%{transform:scale(.2);opacity:.9}100%{transform:scale(5);opacity:0}}

.orb{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);--s:clamp(104px,15vh,132px);
  animation:born 1.1s cubic-bezier(.2,1.5,.35,1) 1.7s backwards}
@keyframes born{from{transform:scale(0)}}
.orb .halo{position:absolute;inset:-45%;border-radius:50%;
  background:radial-gradient(circle,var(--glow-e) 0,transparent 60%),radial-gradient(circle at 70% 70%,var(--glow-c) 0,transparent 55%);
  filter:blur(14px);animation:breathe 6s ease-in-out 2.8s infinite}
.orb .ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;clip-path:circle(50%);-webkit-mask-image:radial-gradient(circle,#000 70%,#000 71%);isolation:isolate;animation:float 6s ease-in-out 2.8s infinite;
  background:
    radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0,rgba(255,255,255,.55) 7%,transparent 26%),
    radial-gradient(circle at 42% 40%,var(--emerald-hi) 0,var(--emerald) 50%,var(--emerald-deep) 100%);
  box-shadow:inset -14px -16px 26px -6px var(--coral),inset -4px -6px 14px rgba(255,190,170,.35),inset 8px 10px 24px rgba(255,255,255,.18),0 26px 50px -18px rgba(6,64,47,.5),18px 22px 60px -20px var(--glow-c)}
.orb .ball::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 20%,rgba(255,255,255,.28) 30%,transparent 42% 70%,rgba(255,156,142,.35) 80%,transparent 92%);
  mix-blend-mode:soft-light;animation:spin 9s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

.orbit{position:absolute;left:50%;top:50%;width:calc(var(--s) * 2.05);height:calc(var(--s) * 2.05);margin:calc(var(--s) * -1.025);--s:clamp(104px,15vh,132px);
  transform:rotateX(74deg) rotateZ(-14deg);animation:appear 1s ease 2.3s backwards}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);animation:spin 16s linear infinite}
.orbit .ring i{position:absolute;width:9px;height:9px;border-radius:50%;left:50%;margin-left:-4.5px}
.orbit .ring i:first-child{top:-5px;background:var(--coral);box-shadow:0 0 12px var(--coral)}
.orbit .ring i:last-child{bottom:-5px;background:var(--emerald);box-shadow:0 0 12px var(--emerald)}
@keyframes appear{from{opacity:0}}

.spark{position:absolute;width:var(--z);height:var(--z);opacity:0;color:var(--coral);
  animation:twinkle 3.6s ease-in-out var(--d) infinite}
.spark svg{display:block;width:100%;height:100%}
.spark.s1{--z:16px;--d:2.6s;left:22%;top:12%}
.spark.s2{--z:11px;--d:3.4s;right:24%;top:20%;color:var(--emerald)}
.spark.s3{--z:13px;--d:4.1s;right:30%;bottom:8%}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}40%,60%{opacity:1;transform:scale(1) rotate(45deg)}}

h1{
  font-weight:600;font-size:clamp(36px,6.4vw,72px);line-height:1.02;letter-spacing:-.035em;
  max-width:14ch;text-wrap:balance;
}
h1 em{
  display:inline-block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;
  font-size:1.16em;letter-spacing:-.01em;line-height:.9;padding:0 .06em .08em;
  background:linear-gradient(100deg,var(--acc-a) 0%,var(--acc-b) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lead{margin-top:clamp(16px,2.6vh,24px);max-width:34ch;font-size:clamp(16px,1.6vw,18.5px);line-height:1.55;color:var(--muted);text-wrap:pretty}

.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}.d4{animation-delay:1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

footer{
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;
  padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.5;color:var(--muted);
}
footer .req{display:flex;flex-wrap:wrap;gap:4px 16px}

@media (max-width:520px){
  header{flex-wrap:wrap}
  .chip{font-size:11px;padding:8px 12px}
  .arrow{width:84px;height:18px;margin-top:-9px}
  @keyframes in-l{0%{left:0;opacity:0}18%{opacity:1}82%{left:calc(50% - 80px);opacity:1;transform:scaleX(1)}100%{left:calc(50% - 80px);opacity:0;transform:scaleX(.15) translateX(220px)}}
  @keyframes in-r{0%{right:0;opacity:0}18%{opacity:1}82%{right:calc(50% - 80px);opacity:1;transform:scaleX(1)}100%{right:calc(50% - 80px);opacity:0;transform:scaleX(.15) translateX(-220px)}}
  footer{flex-direction:column}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .arrow{display:none}
  .burst{display:none}
}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i class="e"></i><i class="c"></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="page">
  <header class="rise d1">
    <a class="mark" href="/" aria-label="Aivestum">a<span class="i">ı</span>vestum</a>
    <span class="chip"><b aria-hidden="true"></b>Готовимся к запуску</span>
  </header>

  <main>
    <div class="scene" aria-hidden="true">
      <div class="arrow l">
        <svg viewBox="0 0 118 24"><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset=".6" stop-color="currentColor"/></linearGradient></defs>
          <path d="M2 12H112" stroke="url(#gl)" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M101 3.5L112 12L101 20.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <div class="arrow r">
        <svg viewBox="0 0 118 24"><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset=".6" stop-color="currentColor"/></linearGradient></defs>
          <path d="M2 12H112" stroke="url(#gr)" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M101 3.5L112 12L101 20.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <span class="burst"></span><span class="burst b2"></span>
      <div class="orbit"><div class="ring"><i></i><i></i></div></div>
      <div class="orb"><div class="halo"></div><div class="ball"></div></div>
      <span class="spark s1"><svg viewBox="0 0 20 20"><path d="M10 0C10.8 6 14 9.2 20 10C14 10.8 10.8 14 10 20C9.2 14 6 10.8 0 10C6 9.2 9.2 6 10 0Z" fill="currentColor"/></svg></span>
      <span class="spark s2"><svg viewBox="0 0 20 20"><path d="M10 0C10.8 6 14 9.2 20 10C14 10.8 10.8 14 10 20C9.2 14 6 10.8 0 10C6 9.2 9.2 6 10 0Z" fill="currentColor"/></svg></span>
      <span class="spark s3"><svg viewBox="0 0 20 20"><path d="M10 0C10.8 6 14 9.2 20 10C14 10.8 10.8 14 10 20C9.2 14 6 10.8 0 10C6 9.2 9.2 6 10 0Z" fill="currentColor"/></svg></span>
    </div>

    <h1 class="rise d2">Планируйте праздник <em>с умом</em></h1>
    <p class="lead rise d3">Скоро здесь появится простой способ устроить праздник: спокойно, понятно и без лишних хлопот.</p>
  </main>

  <footer class="rise d4">
    <span>© 2026 Aivestum, проект ООО «Время праздновать»</span>
    <span class="req"><span>ОГРН 1267700177876</span><span>ИНН 9703248509</span></span>
  </footer>
</div>
</body>
</html>
